<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Cyber. VPN</title>
    <script type="text/javascript">
      // This 404.html script is used to handle Single Page Application (SPA) routing on GitHub Pages.
      // It captures the current path and redirects to index.html, where the router will handle it.
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Save the intended path in sessionStorage so index.html can retrieve it
        sessionStorage.redirect = path + search + hash;

        // Redirect to the root index.html
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
  </body>
</html>
