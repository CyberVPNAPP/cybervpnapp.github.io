    <title>Cyber. VPN</title>
    <script type="text/javascript">
      (function() {
        var l = window.location;
        sessionStorage.redirect = l.pathname + l.search + l.hash;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, -1).join('/') + '/index.html'
        );
      })();
    </script>
